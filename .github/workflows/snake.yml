name: Generate Snake Animation

on:
  schedule:
    # rebuild the snake once a day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#B600A8&color_dots=#1b1b1b,#6b258c,#9d28a0,#d12bb0,#ffae4f
            dist/snake.svg?palette=github-dark&color_snake=#B600A8&color_dots=#1b1b1b,#6b258c,#9d28a0,#d12bb0,#ffae4f

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
